_exclude:
  - "copier.yml"

project_name:
  type: str
  help: "What is your game's name?"
  default: "Python Game"

package_name:
  type: str
  help: "Python package name (snake_case)"
  default: "{{ project_name|lower|replace(' ', '_')|replace('-', '_') }}"

project_description:
  type: str
  help: "Short description of the game"
  default: "A 2D arcade game built with Raylib and decoupled headless physics simulation."

author_name:
  type: str
  help: "Author name"
  default: "Developer"

author_email:
  type: str
  help: "Author email address"
  default: "dev@example.com"

backlog_provider:
  type: str
  help: "Agile backlog tracking adapter"
  choices:
    - todo
    - github
    - gitlab
  default: todo
