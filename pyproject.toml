[project]
name = "skills-repository"
version = "0.1.0"
description = "High-integrity framework for building specialized AI environments and robust Python applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F",     # Pycodestyle & Pyflakes
    "B",          # flake8-bugbear (common bug patterns)
    "S",          # flake8-bandit (local fast security checks)
    "I",          # isort (import sorting)
]

ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]  # Allow standard assert statements and long lines in test files
"**/*_test.py" = ["S101", "E501"]
"**/*.test.py" = ["S101", "E501"]
"skills/**/*.py" = ["E501", "S", "B007", "F841"]  # Prevent noise from pre-existing assets and inline SVGs
"scripts/*.py" = ["E501"]
