repos:
  - repo: local
    hooks:
      - id: lint-skills
        name: Skill Homogeneity Linter
        entry: python3 scripts/lint_skills.py
        language: system
        files: ^skills/
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
